<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">Five-cycle timeline with a MAC latency of three</title><desc id="desc">P0, P1, and P2 issue in consecutive cycles and accumulate in cycles 3, 4, and 5. The two product registers are shown after each commit.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182c47;font-size:18px}.small{font-size:16px;fill:#52657d}.heading{font-size:27px;font-weight:700}</style>
<rect width="1120" height="510" fill="#f5f8fc"/><text x="38" y="49" class="heading">MAC latency = 3: two product stages before accumulation</text>
<text x="38" y="82" class="small">One eval/commit per column. Registers are shown after commit; accumulation uses the old pipe[1].</text><text x="310" y="133" text-anchor="middle">Cycle 1</text><text x="465" y="133" text-anchor="middle">Cycle 2</text><text x="620" y="133" text-anchor="middle">Cycle 3</text><text x="775" y="133" text-anchor="middle">Cycle 4</text><text x="930" y="133" text-anchor="middle">Cycle 5</text><text x="38" y="189">Issued this cycle</text><rect x="240" y="154" width="140" height="50" rx="9" fill="#deeee6"/><text x="310" y="186" text-anchor="middle" style="fill:#205b40;font-weight:700">P0</text><rect x="395" y="154" width="140" height="50" rx="9" fill="#dfeafb"/><text x="465" y="186" text-anchor="middle" style="fill:#244d85;font-weight:700">P1</text><rect x="550" y="154" width="140" height="50" rx="9" fill="#f6e5ce"/><text x="620" y="186" text-anchor="middle" style="fill:#80501d;font-weight:700">P2</text><rect x="705" y="154" width="140" height="50" rx="9" fill="#edf0f5"/><text x="775" y="186" text-anchor="middle" style="fill:#778398;font-weight:700">—</text><rect x="860" y="154" width="140" height="50" rx="9" fill="#edf0f5"/><text x="930" y="186" text-anchor="middle" style="fill:#778398;font-weight:700">—</text><text x="38" y="251">pipe[0] · newest</text><rect x="240" y="216" width="140" height="50" rx="9" fill="#deeee6"/><text x="310" y="248" text-anchor="middle" style="fill:#205b40;font-weight:700">P0</text><rect x="395" y="216" width="140" height="50" rx="9" fill="#dfeafb"/><text x="465" y="248" text-anchor="middle" style="fill:#244d85;font-weight:700">P1</text><rect x="550" y="216" width="140" height="50" rx="9" fill="#f6e5ce"/><text x="620" y="248" text-anchor="middle" style="fill:#80501d;font-weight:700">P2</text><rect x="705" y="216" width="140" height="50" rx="9" fill="#edf0f5"/><text x="775" y="248" text-anchor="middle" style="fill:#778398;font-weight:700">—</text><rect x="860" y="216" width="140" height="50" rx="9" fill="#edf0f5"/><text x="930" y="248" text-anchor="middle" style="fill:#778398;font-weight:700">—</text><text x="38" y="313">pipe[1] · oldest</text><rect x="240" y="278" width="140" height="50" rx="9" fill="#edf0f5"/><text x="310" y="310" text-anchor="middle" style="fill:#778398;font-weight:700">—</text><rect x="395" y="278" width="140" height="50" rx="9" fill="#deeee6"/><text x="465" y="310" text-anchor="middle" style="fill:#205b40;font-weight:700">P0</text><rect x="550" y="278" width="140" height="50" rx="9" fill="#dfeafb"/><text x="620" y="310" text-anchor="middle" style="fill:#244d85;font-weight:700">P1</text><rect x="705" y="278" width="140" height="50" rx="9" fill="#f6e5ce"/><text x="775" y="310" text-anchor="middle" style="fill:#80501d;font-weight:700">P2</text><rect x="860" y="278" width="140" height="50" rx="9" fill="#edf0f5"/><text x="930" y="310" text-anchor="middle" style="fill:#778398;font-weight:700">—</text><text x="38" y="375">To accumulation</text><rect x="240" y="340" width="140" height="50" rx="9" fill="#edf0f5"/><text x="310" y="372" text-anchor="middle" style="fill:#778398;font-weight:700">—</text><rect x="395" y="340" width="140" height="50" rx="9" fill="#edf0f5"/><text x="465" y="372" text-anchor="middle" style="fill:#778398;font-weight:700">—</text><rect x="550" y="340" width="140" height="50" rx="9" fill="#deeee6"/><text x="620" y="372" text-anchor="middle" style="fill:#205b40;font-weight:700">P0</text><rect x="705" y="340" width="140" height="50" rx="9" fill="#dfeafb"/><text x="775" y="372" text-anchor="middle" style="fill:#244d85;font-weight:700">P1</text><rect x="860" y="340" width="140" height="50" rx="9" fill="#f6e5ce"/><text x="930" y="372" text-anchor="middle" style="fill:#80501d;font-weight:700">P2</text><text x="38" y="437">P0, P1, and P2 are product entries carrying value, valid, and last.</text>
<text x="38" y="469" class="small">Three-cycle latency, one issue per cycle. OS draining and array transport delays are excluded.</text></svg>