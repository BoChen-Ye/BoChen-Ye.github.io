<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
<title id="title">PE datapaths: OS and stationary-operand modes</title><desc id="desc">Input a is always registered and forwarded. OS uses streaming b, a local accumulator, and a drain buffer. WS, IS, and DIP use stationary b and incoming partial sums. State is evaluated before it is committed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182c47;font-size:17px}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:15px;fill:#52657d}.box{fill:#fff;stroke:#a8bdd4;stroke-width:1.5;rx:12}.arrow{fill:none;stroke:#52657d;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="670" fill="#f5f8fc"/>
<text x="38" y="48" class="title">One PE, two datapaths</text><text x="38" y="77" class="small">A shared interface and timing model, with separate OS and stationary-operand computation.</text>
<rect x="30" y="99" width="1060" height="78" rx="14" fill="#e4edf8"/>
<text x="55" y="130" class="head">Shared state updates</text><text x="55" y="157">a input → a register → a output; eval computes next, then commit updates cur.</text>
<rect x="30" y="198" width="515" height="380" rx="16" fill="#e9f4f0"/>
<rect x="565" y="198" width="525" height="380" rx="16" fill="#edf0fb"/>
<text x="52" y="233" class="head">OS · Output stationary</text><text x="588" y="233" class="head" style="font-size:20px">WS / IS / DIP · Stationary operand</text>
<rect x="54" y="254" width="160" height="50" class="box"/><text x="70" y="285">a × input b</text>
<rect x="298" y="254" width="220" height="50" class="box"/><text x="313" y="285">b register → b output</text>
<path d="M134 304V327" class="arrow"/>
<rect x="54" y="330" width="190" height="52" class="box"/><text x="70" y="362">Product pipe: L−1</text>
<path d="M149 382V405" class="arrow"/>
<rect x="54" y="408" width="190" height="52" class="box"/><text x="70" y="440">acc + product</text>
<path d="M244 434H298" class="arrow"/>
<rect x="301" y="408" width="217" height="52" class="box"/><text x="317" y="440">last: drain; clear acc</text>
<path d="M409 460V491" class="arrow"/>
<rect x="54" y="494" width="464" height="57" class="box"/><text x="70" y="519" style="font-size:16px">psum: upstream first, otherwise buffered drain</text><text x="70" y="541" class="small">A new result first enters drain, then the output.</text>
<text x="276" y="363" class="small">Not last: update acc</text>
<rect x="589" y="254" width="476" height="50" class="box"/><text x="606" y="285" style="font-size:16px">load_w: input b → stationary b → load-chain output</text>
<path d="M826 304V327" class="arrow"/>
<rect x="589" y="330" width="218" height="52" class="box"/><text x="605" y="362">a × stationary b</text>
<path d="M807 356H842" class="arrow"/>
<rect x="845" y="330" width="220" height="52" class="box"/><text x="862" y="362">Product pipe: L−1</text>
<path d="M955 382V405" class="arrow"/>
<rect x="589" y="408" width="476" height="52" class="box"/><text x="605" y="440" style="font-size:16px">Retiring product + input psum (or 0 if invalid)</text>
<path d="M826 460V491" class="arrow"/>
<rect x="589" y="494" width="476" height="57" class="box"/><text x="605" y="519">psum output → next row</text><text x="605" y="541" class="small">No valid retiring product: bypass input psum.</text>
<text x="39" y="613">L = mac_latency (1–8); value, valid, and last travel together.</text>
<text x="39" y="643" class="small">Logical dataflow, not a physical layout. The scheduler handles alignment and draining; there is no ready handshake.</text>
</svg>